name: IMSDK_UAT_Compilation_PR
run-name: "${{ github.event.workflow_run.display_title }}"

# workflow_run runs in the base-repo context (secrets available) after the
# untrusted pull_request producer completes.  Three mitigations make this safe:
#   1. Fork PRs are gated behind a PRODUCTION environment (maintainer approval).
#   2. The commit SHA comes from github.event.workflow_run.head_sha (trusted
#      GitHub event data), never from the artifact written by the fork runner.
#   3. No ${{ }} template expressions appear in run: or script: blocks —
#      attacker-reachable values are passed through env: vars instead.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["IMSDK_UAT_Compilation"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  statuses: write

jobs:
  # Fork PRs pause here until a repo maintainer approves in the PRODUCTION environment.
  # The maintainer should inspect the fork diff — especially build scripts —
  # before approving, since those run with S3_WEBAPP_TOKEN in scope.
  approve-fork:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    environment: PRODUCTION
    runs-on: ubuntu-latest
    steps:
      - name: Fork PR approved by maintainer
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: echo "Fork PR from ${HEAD_REPO} approved — proceeding with privileged build"

  # Internal PRs (branch on the same repo) are trusted and proceed immediately.
  approve-internal:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Internal PR — no approval required
        run: echo "Internal PR — proceeding"

  init:
    needs: [approve-fork, approve-internal]
    # Runs when exactly one of the mutually exclusive approve gates succeeded.
    if: >-
      always() &&
      (needs.approve-fork.result == 'success' || needs.approve-internal.result == 'success')
    runs-on: ubuntu-latest

    outputs:
      sdk-url: ${{ steps.urls.outputs.sdk-url }}
      image-urls: ${{ steps.urls.outputs.image-urls }}
      # Use the SHA from the trusted workflow_run event, NOT from the artifact.
      # An artifact is written by the (potentially untrusted) producer runner and
      # must not be used to select which commit is checked out and built here.
      pr-sha: ${{ github.event.workflow_run.head_sha }}
      pr-number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Download PR context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pr-context
          path: pr

      - name: Read PR number from artifact
        id: pr
        run: |
          echo "number=$(cat pr/NR)" >> "$GITHUB_OUTPUT"

      - name: Report pending status on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: "pending",
              context: "IMSDK_UAT_Compilation_PR",
              description: "Build running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          allow-unsafe-pr-checkout: true

      - name: Resolve SDK URL from latest wrynose nightly
        id: urls
        uses: ./.github/actions/resolve-nightly-download-url
        with:
          token: ${{ secrets.QUALCOMM_LINUX_PAT }}
          artifact-token: ${{ secrets.S3_WEBAPP_TOKEN }}

  build:
    needs: init
    uses: ./.github/workflows/imsdk-build.yml
    with:
      ref: ${{ needs.init.outputs.pr-sha }}
      sdk-url: ${{ needs.init.outputs.sdk-url }}
      image-urls: ${{ needs.init.outputs.image-urls }}
    secrets:
      s3-webapp-token: ${{ secrets.S3_WEBAPP_TOKEN }}

  report-status:
    needs: [init, build]
    if: always() && needs.init.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Report final status on PR
        uses: actions/github-script@v7
        env:
          PR_SHA: ${{ needs.init.outputs.pr-sha }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const state = process.env.BUILD_RESULT === 'success' ? 'success' : 'failure';
            const description = process.env.BUILD_RESULT === 'success' ? 'Build succeeded' : 'Build failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_SHA,
              state,
              context: "IMSDK_UAT_Compilation_PR",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  check-run:
    runs-on: ubuntu-latest
    needs: [init, build, report-status]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.init.outputs.pr-sha }}
          allow-unsafe-pr-checkout: true

      - name: Post check run
        id: post-check-run
        if: needs.build.result == 'success'
        uses: ./.github/actions/check-run
        with:
          sha: ${{ needs.init.outputs.pr-sha }}
          repo: ${{ github.repository }}
          s3_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}
          github_token: ${{ github.token }}
          workflow_name: " for IMSDK_UAT_Compilation_PR"
