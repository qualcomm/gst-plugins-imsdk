name: IMSDK_UAT_Compilation_PR
run-name: "${{ github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: ["IMSDK_UAT_Compilation"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  statuses: write

jobs:
  init:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      sdk-url: ${{ steps.urls.outputs.sdk-url }}
      image-urls: ${{ steps.urls.outputs.image-urls }}
      pr-sha: ${{ steps.pr.outputs.sha }}
      pr-number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Download PR context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pr-context
          path: pr

      - name: Read PR context
        id: pr
        run: |
          echo "number=$(cat pr/NR)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr/SHA)" >> "$GITHUB_OUTPUT"

      - name: Report pending status on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ steps.pr.outputs.sha }}",
              state: "pending",
              context: "IMSDK_UAT_Compilation_PR",
              description: "Build running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Resolve SDK URL from latest wrynose nightly
        id: urls
        uses: ./.github/actions/resolve-nightly-download-url
        with:
          token: ${{ secrets.QUALCOMM_LINUX_PAT }}
          artifact-token: ${{ secrets.S3_WEBAPP_TOKEN }}

  build:
    needs: init
    uses: ./.github/workflows/imsdk-build.yml
    with:
      ref: ${{ needs.init.outputs.pr-sha }}
      sdk-url: ${{ needs.init.outputs.sdk-url }}
      image-urls: ${{ needs.init.outputs.image-urls }}
    secrets:
      s3-webapp-token: ${{ secrets.S3_WEBAPP_TOKEN }}

  report-status:
    needs: [init, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report final status on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ needs.init.outputs.pr-sha }}",
              state: "${{ needs.build.result == 'success' && 'success' || 'failure' }}",
              context: "IMSDK_UAT_Compilation_PR",
              description: "${{ needs.build.result == 'success' && 'Build succeeded' || 'Build failed' }}",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  check-run:
    runs-on: ubuntu-latest
    needs: [init, build, report-status]
    steps:
      - name: Post check run
        id: post-check-run
        if: needs.build.result == 'success'
        uses: ./.github/actions/check-run
        with:
          sha: ${{ needs.init.outputs.pr-sha }}
          repo: ${{ github.repository }}
          s3_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}
          github_token: ${{ secrets.QUALCOMM_LINUX_PAT }}
          workflow_name: "for IMSDK_UAT_Compilation_PR"
